          "name": "Is Valoryx GST compliant?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Valoryx is fully GST compliant with support for CGST, SGST, IGST, and CESS calculations. It automatically computes taxes based on your business location and customer location. HSN/SAC codes, GSTIN validation, and GST-ready invoice formats are all built-in."

          "name": "Can I use Valoryx offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! Valoryx works as a Progressive Web App (PWA) that functions offline. You can create bills, manage inventory, and serve customers even without internet. All data automatically syncs when you are back online."

          "name": "How many users can I add?",

          }
        },
        {
          "@type": "Question",
          "name": "Is my data secure?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We use 256-bit SSL encryption for all data transfers. Your data is stored on secure cloud servers with daily backups. We also support two-factor authentication (TOTP) and maintain complete audit logs of all actions."
          }
        },
        {
          "@type": "Question",
          "name": "What payment methods are supported?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Valoryx supports Cash, Card (Credit/Debit), UPI, Net Banking, Cheque, and Customer Credit. You can split a single bill across multiple payment methods for maximum flexibility."
          }
        },

          "@type": "Question",
          "name": "Is Valoryx the best billing software for Indian businesses?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Valoryx is purpose-built for Indian retail and service businesses. It supports GST (CGST/SGST/IGST), HSN codes, GSTIN validation, thermal printers, UPI payments, and works offline. Designed for kirana stores, salons, restaurants, boutiques, and wholesale businesses across India."
          }
        },
        {
          "@type": "Question",
          "name": "Does Valoryx work on mobile and desktop?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Valoryx is fully responsive and works on desktop, laptop, tablet, or mobile. It installs as a PWA for app-like experience and offers a native desktop app for Windows and Mac."
          }
        },

          "@type": "Question",
          "name": "Can I manage multiple branches from one account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Valoryx supports multi-branch management with per-branch inventory, sales tracking, team management, and stock transfers between branches — all from a single dashboard."

          "@type": "Question",

          "acceptedAnswer": {
            "@type": "Answer",
