name: CI/CD

on:
  push:
    branches: [main, development]
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - 'electron/**'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pytest (offline/SQLite mode)
        working-directory: backend
        env:
          # Dummy values for CI only — tests run against a throwaway
          # in-memory SQLite DB; no real service or secret is involved.
          JWT_SECRET: ci-only-jwt-secret-not-used-in-production-0000
          SECRET_KEY: ci-only-flask-secret-not-used-in-production-00
          DB_MODE: offline
        run: pytest

  frontend-tests:
    name: Frontend tests + type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Run vitest
        working-directory: frontend-react
        run: npm run test:run

      - name: Build (includes tsc type-check)
        working-directory: frontend-react
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/Valoryx
            git pull
            pm2 restart valoryx
