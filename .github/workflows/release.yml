name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from git tag
        id: version
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          TAG="${GIT_REF#refs/tags/v}"
          echo "VERSION=$TAG" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $TAG"

      - name: Sync package.json version with git tag
        shell: bash
        run: |
          npm version "${{ steps.version.outputs.VERSION }}" --no-git-tag-version --allow-same-version
          echo "package.json version is now: $(node -p "require('./package.json').version")"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: |
          cd frontend-react
          npm install

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Build embedded Python runtime
        run: npm run build:python

      - name: Build frontend for Electron
        shell: bash
        run: |
          cd frontend-react
          npm run build:electron

      - name: Verify Electron bundle has relative asset paths
        shell: bash
        run: |
          if grep -q 'src="/assets/' backend/static/frontend/index.html; then
            echo "ERROR: index.html has absolute /assets/ paths — Electron file:// will 404."
            echo "       build:electron likely did not run with ELECTRON_BUILD=true."
            exit 1
          fi
          echo "OK: index.html uses relative asset paths."

      - name: Verify embedded Python is present
        shell: bash
        run: |
          if [ ! -f python/python.exe ]; then
            echo "ERROR: python/python.exe missing — embedded Python step failed."
            exit 1
          fi
          echo "OK: python/python.exe present ($(du -sh python | cut -f1))"

      - name: Package installer
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated version back to main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git add package.json
          if git diff --cached --quiet; then
            echo "package.json already has correct version, nothing to commit"
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }} [skip ci]"
            git push origin main
          fi
