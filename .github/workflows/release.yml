name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from git tag
        id: version
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          TAG="${GIT_REF#refs/tags/v}"
          echo "VERSION=$TAG" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $TAG"

      - name: Sync package.json version with git tag
        shell: bash
        run: |
          npm version "${{ steps.version.outputs.VERSION }}" --no-git-tag-version --allow-same-version
          echo "package.json version is now: $(node -p "require('./package.json').version")"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: |
          cd frontend-react
          npm install

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Materialize backend/env.local from secret
        shell: bash
        env:
          BACKEND_ENV_LOCAL_B64: ${{ secrets.BACKEND_ENV_LOCAL_B64 }}
          DESKTOP_OAUTH_SECRET: ${{ secrets.DESKTOP_OAUTH_SECRET }}
          DB_URL_OVERRIDE: ${{ secrets.DB_URL_OVERRIDE }}
        run: |
          if [ -z "${BACKEND_ENV_LOCAL_B64}" ]; then
            echo "ERROR: BACKEND_ENV_LOCAL_B64 secret is not set in repo settings."
            echo "       The installer needs backend/env.local with JWT_SECRET, SECRET_KEY,"
            echo "       DB_URL, SUPABASE_* etc. Without it the Flask backend crashes at startup."
            exit 1
          fi
          echo "${BACKEND_ENV_LOCAL_B64}" | base64 -d > backend/env.local
          # Append the desktop Google-login shared secret if provided as its own
          # repo secret (simpler than re-encoding the whole env.local blob). Must
          # match the value in the cloud server's .env. Skipped if already present.
          if [ -n "${DESKTOP_OAUTH_SECRET}" ] && ! grep -q "^DESKTOP_OAUTH_SECRET=" backend/env.local; then
            printf '\nDESKTOP_OAUTH_SECRET=%s\n' "${DESKTOP_OAUTH_SECRET}" >> backend/env.local
            echo "OK: appended DESKTOP_OAUTH_SECRET to env.local"
          fi
          # Override DB_URL from a standalone repo secret (e.g. to switch to the
          # transaction pooler :6543) without re-encoding the whole blob. Replaces
          # any existing DB_URL line so main.js / config.py read the new value.
          if [ -n "${DB_URL_OVERRIDE}" ]; then
            grep -v "^DB_URL=" backend/env.local > backend/env.local.tmp || true
            printf 'DB_URL=%s\n' "${DB_URL_OVERRIDE}" >> backend/env.local.tmp
            mv backend/env.local.tmp backend/env.local
            echo "OK: DB_URL overridden from DB_URL_OVERRIDE secret"
          fi
          # Cheap sanity check without printing values
          for key in JWT_SECRET SECRET_KEY DB_URL; do
            if ! grep -q "^${key}=" backend/env.local; then
              echo "ERROR: backend/env.local is missing ${key}"
              exit 1
            fi
          done
          if grep -q "^DESKTOP_OAUTH_SECRET=" backend/env.local; then
            echo "OK: env.local materialized (desktop Google login ENABLED)"
          else
            echo "WARN: env.local has no DESKTOP_OAUTH_SECRET — desktop Google login will be DISABLED (501)."
          fi

      - name: Build embedded Python runtime
        run: npm run build:python

      - name: Build frontend for Electron
        shell: bash
        run: |
          cd frontend-react
          npm run build:electron

      - name: Verify Electron bundle has relative asset paths
        shell: bash
        run: |
          if grep -q 'src="/assets/' backend/static/frontend/index.html; then
            echo "ERROR: index.html has absolute /assets/ paths — Electron file:// will 404."
            echo "       build:electron likely did not run with ELECTRON_BUILD=true."
            exit 1
          fi
          echo "OK: index.html uses relative asset paths."

      - name: Verify embedded Python is present
        shell: bash
        run: |
          if [ ! -f python/python.exe ]; then
            echo "ERROR: python/python.exe missing — embedded Python step failed."
            exit 1
          fi
          echo "OK: python/python.exe present ($(du -sh python | cut -f1))"

      - name: Package installer
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated version back to main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The job checked out the tag, not the branch — discard the local
          # npm-version edit, move to the current tip of main, and redo the
          # bump there so the push can't be rejected as non-fast-forward.
          git checkout -- package.json
          git fetch origin main
          git checkout -B main origin/main
          npm version "${{ steps.version.outputs.VERSION }}" --no-git-tag-version --allow-same-version
          git add package.json
          if git diff --cached --quiet; then
            echo "package.json already has correct version, nothing to commit"
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }} [skip ci]"
            git push origin main
          fi
